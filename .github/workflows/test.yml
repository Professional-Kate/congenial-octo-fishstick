name: Run Tests

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Create Artifacts directory
        run: mkdir -p Artifacts

      - name: Run Tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=Artifacts/test-results.trx"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML Test Report
        run: reportgenerator -reports:Artifacts/test-results.trx -targetdir:Artifacts/TestReport -reporttypes:Html

      - name: Upload Test Results (TRX + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: Artifacts/